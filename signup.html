<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="page">
  <div class="topbar">
    <div class="brand">Votre <span>Prêt</span></div>
  </div>

  <div class="wrap">
    <div class="card">
      <h1>Connexion</h1>
      <p class="lead">Connectez-vous pour continuer votre demande de prêt.</p>

      <form id="login-form">
        <label for="email">Adresse e-mail</label>
        <input type="email" id="email" required autocomplete="email">

        <label for="password">Mot de passe</label>
        <input type="password" id="password" required autocomplete="current-password">

        <div id="msg" class="msg"></div>

        <button type="submit" class="btn-primary" id="submit-btn">Se connecter</button>
      </form>

      <div class="switch-link">
        Pas encore de compte ? <a href="/signup.html">Créer un compte</a>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById("login-form");
    const msg = document.getElementById("msg");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.className = "msg";
      submitBtn.disabled = true;

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value
          })
        });

        if (!res.ok) {
          msg.className = "msg error";
          msg.textContent = "E-mail ou mot de passe incorrect.";
          submitBtn.disabled = false;
          return;
        }

        window.location.href = "/form.html";
      } catch (err) {
        msg.className = "msg error";
        msg.textContent = "Impossible de contacter le serveur. Réessayez.";
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
