<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demande de prêt</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="page">
  <div class="topbar">
    <div class="brand">Votre <span>Prêt</span></div>
    <a href="#" class="logout" id="logout-link">Déconnexion</a>
  </div>

  <div class="wrap">
    <div class="card" id="card">
      <p class="empty">Chargement…</p>
    </div>
  </div>

  <script>
    const card = document.getElementById("card");
    let currentUser = null;

    function renderForm(user) {
      currentUser = user;
      card.innerHTML = `
        <h1>Votre demande de prêt</h1>
        <p class="lead">Ces informations seront transmises à notre équipe, qui vous recontactera par e-mail à l'adresse ${user.email}.</p>

        <form id="loan-form">
          <label for="firstName">Prénom</label>
          <input type="text" id="firstName" required autocomplete="given-name">

          <label for="lastName">Nom</label>
          <input type="text" id="lastName" required autocomplete="family-name">

          <label for="amount">Montant du prêt souhaité</label>
          <div class="amount-field">
            <input type="number" id="amount" min="1" step="1" required>
            <span class="currency-tag">${user.currencySymbol}</span>
          </div>

          <label for="durationMonths">Durée de remboursement (en mois)</label>
          <input type="number" id="durationMonths" min="1" step="1" required>

          <div id="msg" class="msg"></div>

          <button type="submit" class="btn-primary" id="submit-btn">Valider</button>
        </form>
      `;

      document.getElementById("loan-form").addEventListener("submit", submitLoan);
    }

    function renderConfirmation(user, loan) {
      card.innerHTML = `
        <div class="confirmation">
          <div class="check">✓</div>
          <h1>Demande envoyée</h1>
          <p class="lead" style="margin-left:auto;margin-right:auto;">
            Merci ${loan.firstName}, votre demande de ${loan.amount.toLocaleString("fr-FR")} ${user.currencySymbol}
            sur ${loan.durationMonths} mois a bien été enregistrée. Nous vous recontacterons à ${user.email}.
          </p>
          <button class="btn-secondary" id="edit-btn">Modifier ma demande</button>
        </div>
      `;
      document.getElementById("edit-btn").addEventListener("click", () => renderForm(currentUser));
    }

    async function submitLoan(e) {
      e.preventDefault();
      const msg = document.getElementById("msg");
      const submitBtn = document.getElementById("submit-btn");
      msg.className = "msg";
      submitBtn.disabled = true;

      try {
        const res = await fetch("/api/loan", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            firstName: document.getElementById("firstName").value,
            lastName: document.getElementById("lastName").value,
            amount: document.getElementById("amount").value,
            durationMonths: document.getElementById("durationMonths").value
          })
        });
        const data = await res.json();

        if (!res.ok) {
          msg.className = "msg error";
          msg.textContent = "Merci de vérifier les champs saisis.";
          submitBtn.disabled = false;
          return;
        }

        renderConfirmation(currentUser, data.loan);
      } catch (err) {
        msg.className = "msg error";
        msg.textContent = "Impossible de contacter le serveur. Réessayez.";
        submitBtn.disabled = false;
      }
    }

    document.getElementById("logout-link").addEventListener("click", async (e) => {
      e.preventDefault();
      await fetch("/api/logout", { method: "POST" });
      window.location.href = "/login.html";
    });

    // Charge l'utilisateur connecté et affiche le formulaire (ou la dernière demande envoyée).
    fetch("/api/me")
      .then((r) => {
        if (!r.ok) throw new Error("not_authenticated");
        return r.json();
      })
      .then(({ user, loans }) => {
        if (loans && loans.length > 0) {
          renderConfirmation(user, loans[loans.length - 1]);
          currentUser = user;
        } else {
          renderForm(user);
        }
      })
      .catch(() => {
        window.location.href = "/login.html";
      });
  </script>
</body>
</html>
